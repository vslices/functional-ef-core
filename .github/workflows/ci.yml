name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout VSlices ForkExt candidate
        uses: actions/checkout@v4
        with:
          repository: vslices/framework
          ref: refactor/forkext-extract-minimal
          path: framework
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker
        run: docker info

      - name: Reject original LanguageExt dependency
        run: |
          if grep -R 'PackageReference Include="LanguageExt.Core"' EntityFrameworkCore.Functional; then exit 1; fi
      - name: Restore
        run: dotnet restore functional-ef-core.slnx

      - name: Check dependency graph
        run: |
          dotnet list functional-ef-core.slnx package --include-transitive > dependency-list.txt
          if grep -i 'LanguageExt.Core' dependency-list.txt; then exit 1; fi
      - name: Test
        run: dotnet run --project tests/EntityFrameworkCore.Functional.Tests/EntityFrameworkCore.Functional.Tests.csproj --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack
          EntityFrameworkCore.Functional/EntityFrameworkCore.Functional.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:PackageVersion=0.0.0-ci
